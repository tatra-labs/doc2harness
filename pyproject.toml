[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2harness"
version = "0.1.0"
description = "A deterministic benchmark for the harness around a coding agent"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "tatra-labs"}]
keywords = ["agents", "benchmark", "llm", "harness", "evaluation"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
doc2harness = "doc2harness.cli:main"

[project.urls]
Homepage = "https://github.com/tatra-labs/doc2harness"

[tool.setuptools]
packages = ["doc2harness"]

[tool.setuptools.package-data]
doc2harness = ["spec/*.md", "cases/*.json"]
